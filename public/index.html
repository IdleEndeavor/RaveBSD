<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rave Book Search: Free eBook &amp; Audiobook Finder</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="js/common.js"></script>
    <script src="js/verify.js"></script>

    <meta name="description" content="Search many free eBook and audiobook sources at once. Direct download links, cover art and format filtering.">
    <!-- A personal instance should not show up in search engines. -->
    <meta name="robots" content="noindex, nofollow">

    <link href="img/favicon.png" rel="shortcut icon">
</head>
<body>


    <!-- ── Main search area ─────────────────────────────────────────────── -->
    <main class="maindiv">

        <div class="searchlogo">
            <img id="searchlogo" src="img/search-logo.png" alt="Rave Book Search" onclick="location.href='index.html';">
        </div>

        <!-- Tagline, shown before first search, hidden after -->
        <p class="tagline" id="tagline">
            Search across multiple websites in one go to find free book downloads
        </p>

        <!-- The one search bar. It is position:sticky (see CSS), so it stays at the top while scrolling.
             The small logo inside it is hidden until it sticks, then grows in. -->
        <div class="search-bar-wrap" id="search-bar-wrap">
            <img class="search-bar-logo" id="search-bar-logo" src="img/search-logo.png" alt="Rave Book Search" onclick="location.href='index.html';">
            <input id="search-input" class="search-input" type="text"
                placeholder="Search for your favourite books"
                autocomplete="off" spellcheck="false">
            <button id="search-btn" class="search-btn" aria-label="Search">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
        </div>

        <!-- Advanced search: title, author, year, formats and sources picked by hand -->
        <div class="adv-row"><button type="button" id="adv-toggle" class="adv-toggle" aria-expanded="false">Advanced search</button></div>
        <form id="adv-panel" class="access-card adv-panel" hidden>
            <div class="access-field"><span class="access-field-label">Search in</span>
                <div class="adv-chips" id="adv-mode">
                    <button type="button" class="filter-chip active" data-mode="ebooks" aria-pressed="true">eBooks</button>
                    <button type="button" class="filter-chip" data-mode="audiobooks" aria-pressed="false">Audiobooks</button>
                </div></div>
            <label class="access-field"><span class="access-field-label">Book title</span><input type="text" id="adv-title" autocomplete="off" spellcheck="false"></label>
            <label class="access-field"><span class="access-field-label">Author</span><input type="text" id="adv-author" autocomplete="off" spellcheck="false"></label>
            <label class="access-field"><span class="access-field-label">Year (for example 2019, or a range like 1990-2000)</span><input type="text" id="adv-year" inputmode="numeric" autocomplete="off"></label>
            <div class="access-field"><span class="access-field-label">Formats (none selected means any)</span><div class="adv-chips" id="adv-formats"></div></div>
            <div class="access-field"><span class="access-field-label">Sources (none selected means all)</span><div class="adv-chips" id="adv-sources"></div></div>
            <div class="access-actions access-actions-end">
                <button type="submit" class="access-btn primary">Search</button>
                <button type="button" class="access-btn" id="adv-clear">Clear</button>
            </div>
        </form>

        <!-- Results, empty until search is run -->
        <div id="results-container" class="results-container" aria-live="polite"></div>

    </main>

    <!-- ── Footer ───────────────────────────────────────────────────────── -->
    <footer class="footer-links">
        <a href="backend.html">Backend</a>
    </footer>
    
</body>

<script>

    // API_URL, esc() and postStats() come from js/common.js (loaded in <head>).

    // State for fetchDirectResults(), declared at the very top on purpose. The "check URL params on load"
    // code further down can start a search while this script is still running, and a var declared later in
    // the file would still be undefined at that moment (which silently dropped every response).
    var directSearchSeq = 0;
    var currentDirectAbort = null;
    var DIRECT_TIMEOUT_MS = 45000; // hard cap so the bar can never hang forever

    // ── Logo fade cycle ───────────────────────────────────────────────────────
    // Alternates between two logo images every 6 seconds with a 1s crossfade.
    (function() {
        var images = ['img/search-logo.png', 'img/search-logo-2.png'];
        var i = 0, logo = document.getElementById('searchlogo');
        setInterval(function() {
            logo.style.opacity = 0;
            setTimeout(function() { i = (i+1)%images.length; logo.src = images[i]; logo.style.opacity = 1; }, 1000);
        }, 6000);
    })();

    // ── Source definitions ────────────────────────────────────────────────────
    // Each source has a label, tier (1=best, 3=supplementary), optional tooltip
    // note, and a searchUrl function that builds the search URL for a given query.
    // Tier 1 = shown immediately. Tier 2 = shown below. Tier 3 = collapsed.
    var EBOOK_SOURCES = [
        // ── Tier 1: Shadow libraries and major archives ──
        // Within a tier, cards for sites we only link to come first, and sites RaveBSD also searches
        // directly (the Direct results list) come last.
        { label:"Z-Library",          tier:1, note:"Huge ebook collection, no login needed",  searchUrl:function(q){return"https://z-lib.gd/s/"+enc(q);}},
        { label:"Liber3",             tier:1, note:"IPFS-based book search",                  searchUrl:function(q){return"https://liber3.eth.limo/#/search?q="+enc(q);}},
        { label:"Ocean of PDF",       tier:1, note:"PDF & ebook downloads",                   searchUrl:function(q){return"https://oceanofpdf.com/?s="+enc(q);}},
        { label:"Anna's Archive",    tier:1, note:"Largest shadow library index",            searchUrl:function(q){return"https://annas-archive.gl/search?q="+enc(q);}},
        { label:"Anna's Archive #2", tier:1, note:"Mirror",                                  searchUrl:function(q){return"https://annas-archive.pk/search?q="+enc(q);}},
        { label:"Anna's Archive #3", tier:1, note:"Mirror",                                  searchUrl:function(q){return"https://annas-archive.gd/search?q="+enc(q);}},
        { label:"Library Genesis",    tier:1, note:"Classic shadow library",                  searchUrl:function(q){return"https://libgen.is/search.php?req="+enc(q)+"&lg_topic=libgen&open=0&view=simple&res=25&phrase=1&column=def";}},
        { label:"LibGen Mirror",      tier:1, note:"Mirror",                                  searchUrl:function(q){return"https://libgen.la/index.php?req="+enc(q)+"&columns%5B%5D=t&columns%5B%5D=a&columns%5B%5D=s&columns%5B%5D=y&columns%5B%5D=p&columns%5B%5D=i&objects%5B%5D=f&objects%5B%5D=e&objects%5B%5D=s&objects%5B%5D=a&objects%5B%5D=p&objects%5B%5D=w&topics%5B%5D=l&topics%5B%5D=c&topics%5B%5D=f&topics%5B%5D=a&topics%5B%5D=m&topics%5B%5D=r&topics%5B%5D=s&res=25&filesuns=all";}},
        { label:"LibGen Mirror #2",   tier:1, note:"Mirror",                                  searchUrl:function(q){return"https://libgen.gl/index.php?req="+enc(q)+"&columns%5B%5D=t&columns%5B%5D=a&columns%5B%5D=s&columns%5B%5D=y&columns%5B%5D=p&columns%5B%5D=i&objects%5B%5D=f&objects%5B%5D=e&objects%5B%5D=s&objects%5B%5D=a&objects%5B%5D=p&objects%5B%5D=w&topics%5B%5D=l&topics%5B%5D=c&topics%5B%5D=f&topics%5B%5D=a&topics%5B%5D=m&topics%5B%5D=r&topics%5B%5D=s&res=25&filesuns=all";}},
        { label:"LibGen Mirror #3",   tier:1, note:"Mirror",                                  searchUrl:function(q){return"https://libgen.vg/index.php?req="+enc(q)+"&columns%5B%5D=t&columns%5B%5D=a&columns%5B%5D=s&columns%5B%5D=y&columns%5B%5D=p&columns%5B%5D=i&objects%5B%5D=f&objects%5B%5D=e&objects%5B%5D=s&objects%5B%5D=a&objects%5B%5D=p&objects%5B%5D=w&topics%5B%5D=l&topics%5B%5D=c&topics%5B%5D=f&topics%5B%5D=a&topics%5B%5D=m&topics%5B%5D=r&topics%5B%5D=s&res=25&filesuns=all";}},
        { label:"LibGen Mirror #4",   tier:1, note:"Mirror",                                  searchUrl:function(q){return"https://libgen.bz/index.php?req="+enc(q)+"&columns%5B%5D=t&columns%5B%5D=a&columns%5B%5D=s&columns%5B%5D=y&columns%5B%5D=p&columns%5B%5D=i&objects%5B%5D=f&objects%5B%5D=e&objects%5B%5D=s&objects%5B%5D=a&objects%5B%5D=p&objects%5B%5D=w&topics%5B%5D=l&topics%5B%5D=c&topics%5B%5D=f&topics%5B%5D=a&topics%5B%5D=m&topics%5B%5D=r&topics%5B%5D=s&res=25&filesuns=all";}},
        { label:"Internet Archive",   tier:1, note:"Non-profit digital library",              searchUrl:function(q){return"https://archive.org/search?query="+enc(q)+"&and[]=mediatype%3A%22texts%22";}},
        { label:"Project Gutenberg",  tier:1, note:"70,000+ free public domain books",        searchUrl:function(q){return"https://www.gutenberg.org/ebooks/search/?query="+enc(q);}},
        // ── Tier 2: Reliable open sources ──
        // (none of Tier 2 is searched directly, so no reordering is needed)
        { label:"Standard Ebooks",    tier:2, note:"Beautifully formatted public domain",     searchUrl:function(q){return"https://standardebooks.org/ebooks?query="+enc(q);}},
        { label:"Manybooks",          tier:2, note:"Large public domain catalogue",
          searchUrl:function(q){return"https://manybooks.net/search-book?search="+enc(q);},
          // Manybooks has a public JSON API, used to show live results in the source cards section
          api:function(q){return"https://manybooks.net/api/books?search="+enc(q)+"&format=json&limit=5";},
          parseApi:function(json){
            if(!json||!json.data)return[];
            return json.data.slice(0,5).map(function(b){return{title:b.title+(b.author?", "+b.author:""),url:"https://manybooks.net"+(b.url||"")};});
          }
        },
        { label:"Open Textbook Library", tier:2, note:"Free, openly-licensed textbooks",      searchUrl:function(q){return"https://open.umn.edu/opentextbooks/textbooks?term="+enc(q);}},
        { label:"PDF Room",           tier:2, note:"PDF search engine",                       searchUrl:function(q){return"https://pdfroom.com/search?query="+enc(q);}},
        { label:"Obooko",             tier:2, note:"Free ebooks from indie authors",          searchUrl:function(q){return"https://www.obooko.com/search-result?q="+enc(q);}},
        { label:"eBook Hunter",       tier:2, note:"eBook search engine",                     searchUrl:function(q){return"https://ebook-hunter.org/search/?keyword="+enc(q)+"&x=0&y=0";}},
        { label:"Lectulandia",        tier:2, note:"Spanish & English ebooks",                searchUrl:function(q){return"https://ww3.lectulandia.co/search/"+enc(q);}},
        { label:"BooksCafe",          tier:2, note:"Book search",                             searchUrl:function(q){return"https://bookscafe.net/search?q="+enc(q);}},
        { label:"PDF Drive",          tier:2, note:"Large PDF library",                       searchUrl:function(q){return"https://www.pdfdrive.com/?s="+enc(q);}},
        { label:"Digilibraries",      tier:2, note:"Free ebook library",                      searchUrl:function(q){return"https://digilibraries.com/search/"+enc(q);}},
        // ── Tier 3: Supplementary sources (collapsed by default) ──
        { label:"PDF Grab",           tier:3, searchUrl:function(q){return"https://pdfgrab.com/?s="+enc(q)+"&submit=Search";}},
        { label:"WoWEbook",           tier:3, searchUrl:function(q){return"https://www.wowebook.org/?s="+enc(q);}},
        { label:"Epdf.tips",          tier:3, searchUrl:function(q){return"https://epdf.tips/search/"+enc(q)+"/";}},
        { label:"Zenodo",             tier:3, searchUrl:function(q){return"https://zenodo.org/search?q="+enc(q)+"&l=list&p=1&s=10&sort=bestmatch";}},
        { label:"English e-Reader",   tier:3, note:"English learner ebooks",                  searchUrl:function(q){return"https://english-e-reader.net/findbook?title="+enc(q);}},
        { label:"eBook BB",           tier:3, searchUrl:function(q){return"https://ebookbb.in/?s="+enc(q);}},
        { label:"GetComics",          tier:3, searchUrl:function(q){return"https://getcomics.org/?s="+enc(q);}},
        { label:"Ocean of ePub",      tier:3, searchUrl:function(q){return"https://oceanofepub.net/?s="+enc(q);}},
        { label:"MagazineLib",        tier:3, searchUrl:function(q){return"https://magazinelib.com/?s="+enc(q);}},
        { label:"Free Magazines",     tier:3, searchUrl:function(q){return"https://freemagazines.top/?s="+enc(q);}},
        { label:"Musopen",            tier:3, note:"Free classical sheet music",               searchUrl:function(q){return"https://musopen.org/search/?q="+enc(q);}},
        { label:"Memory of World",    tier:3, note:"Also searched directly, see Direct results", searchUrl:function(q){return"https://library.memoryoftheworld.org/#/search/authors/"+enc(q);}},
    ];

    var AUDIOBOOK_SOURCES = [
        // ── Tier 1: Major audiobook sources ──
        // Same ordering rule as EBOOK_SOURCES: link-only cards first, directly searched sources last.
        { label:"AudioAZ",            tier:1,                                                 searchUrl:function(q){return"https://audioaz.com/en/search?q="+enc(q);}},
        { label:"Audiobooks4Soul",    tier:1,                                                 searchUrl:function(q){return"https://audiobooks4soul.com/?s="+enc(q);}},
        { label:"LibriVox",           tier:1, note:"Free public domain audiobooks",
          searchUrl:function(q){return"https://librivox.org/search/?q="+enc(q)+"&search_form=advanced";},
          // LibriVox has a public JSON API, used to show live results in the source cards section
          api:function(q){return"https://librivox.org/api/feed/audiobooks/title/^"+enc(q)+"?format=json&fields={id,title,url_librivox,authors}";},
          parseApi:function(json){
            if(!json||!json.books)return[];
            return json.books.slice(0,5).map(function(b){
                var a=(b.authors&&b.authors[0])?", "+b.authors[0].first_name+" "+b.authors[0].last_name:"";
                return{title:b.title+a,url:b.url_librivox};
            });
          }
        },
        { label:"Internet Archive",   tier:1, note:"Huge audiobook collection",               searchUrl:function(q){return"https://archive.org/search?query="+enc(q)+"&and[]=mediatype%3A%22audio%22";}},
        // ── Tier 2 ──
        { label:"Big Audiobooks",     tier:2,                                                 searchUrl:function(q){return"https://bigaudiobooks.net/?s="+enc(q);}},
        { label:"Hot Audiobooks",     tier:2,                                                 searchUrl:function(q){return"https://hotaudiobooks.com//?s="+enc(q);}},
        { label:"HD Audiobooks",      tier:2,                                                 searchUrl:function(q){return"https://hdaudiobooks.net//?s="+enc(q);}},
        { label:"Any Audiobook",      tier:2,                                                 searchUrl:function(q){return"https://anyaudiobook.net/?s="+enc(q);}},
        { label:"App Audiobooks",     tier:2,                                                 searchUrl:function(q){return"https://appaudiobooks.net/?s="+enc(q);}},
        { label:"AudiobookBay",       tier:2, note:"Torrent index, no account needed",       searchUrl:function(q){return"https://audiobookbay.lu/?s="+enc(q)+"&cat=undefined%2Cundefined";}},
        { label:"AudiobooksBee",      tier:2, note:"Direct downloads via Rapidgator",         searchUrl:function(q){return"https://audiobooksbee.com/?s="+enc(q);}},
        // ── Tier 3 ──
        { label:"Golden Audiobooks",  tier:3,                                                 searchUrl:function(q){return"https://goldenaudiobook.net/?s="+enc(q)+"&id=28332";}},
        { label:"Audiozaic",          tier:3, note:"Formerly CD Audiobook",                   searchUrl:function(q){return"https://audiozaic.com/?s="+enc(q);}},
        { label:"Storynory",          tier:3, note:"Audio stories, great for kids",           searchUrl:function(q){return"https://www.storynory.com/search/?q="+enc(q);}},
        // LearnOutLoud's search runs entirely in the browser (a Google search widget), so the server
        // cannot scrape it. Link card only.
        { label:"LearnOutLoud",       tier:3,                                                 searchUrl:function(q){return"https://www.learnoutloud.com/Search?q="+enc(q);}},
    ];

    // ── Toast: a small message at the bottom centre, shown when a magnet link is copied ──
    var toastTimer = null;
    function showToast(msg) {
        var t = document.getElementById('toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'toast';
            t.className = 'toast';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        clearTimeout(toastTimer);
        requestAnimationFrame(function() { t.classList.add('show'); });
        toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2200);
    }

    // ── Local stats, recorded by the RaveBSD server (see POST /stats), shown on backend.html.
    function recordSearch(mode) { postStats({ event: 'search', mode: mode }); }
    function recordDownload(fmt, size) { postStats({ event: 'download', fmt: fmt, size: size }); }

    // ── Mode state ────────────────────────────────────────────────────────────
    // A plain search always starts in eBooks mode. Audiobooks is chosen with the Mode chips in the results
    // or in the advanced search panel. The mode is not saved between visits.
    var currentMode = 'ebooks';
    function setMode(mode) { currentMode = mode; }

    // ── Search wiring ─────────────────────────────────────────────────────────
    var searchInput   = document.getElementById('search-input');
    var resultsEl     = document.getElementById('results-container');
    var tagline       = document.getElementById('tagline');

    // Rotating placeholder text in the search box.
    (function() {
        var messages = [
            'Search for your favourite books',
            "Try adding the author's name too",
            'Now indexing LibreTexts and OpenStax',
        ];
        var idx = 0;
        setInterval(function() {
            idx = (idx + 1) % messages.length;
            searchInput.placeholder = messages[idx];
        }, 3200);
    })();

    // Advanced search state. Only applied when the panel is open; null for a plain search.
    var adv = null;
    var ADV_FORMATS = {
        ebooks:     ['epub', 'pdf', 'mobi', 'azw3', 'fb2', 'djvu', 'cbz', 'txt'],
        audiobooks: ['mp3', 'm4b', 'm4a', 'flac', 'zip'],
    };
    var ADV_SOURCES = {
        ebooks:     ['libgen', 'annas', 'zlibrary', 'archive', 'gutenberg', 'openstax', 'libretexts', 'memoryoftheworld', 'royallib', 'mobilism'],
        audiobooks: ['audiobookbay', 'librivox', 'audiobooksbee', 'libgen', 'archive', 'mobilism'],
    };
    var advPanel = document.getElementById('adv-panel');
    var advToggle = document.getElementById('adv-toggle');
    var advMode = 'ebooks';

    function advChips(hostId, values, labelFn) {
        var host = document.getElementById(hostId);
        host.innerHTML = values.map(function(v) {
            return '<button type="button" class="filter-chip" aria-pressed="false" data-val="' + esc(v) + '">' + esc(labelFn(v)) + '</button>';
        }).join('');
        host.querySelectorAll('.filter-chip').forEach(function(b) {
            b.addEventListener('click', function() {
                var on = b.classList.toggle('active');
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
        });
    }
    function sourceName(id) {
        for (var i = 0; i < META_SOURCE_LABELS.length; i++) if (META_SOURCE_LABELS[i][0] === id) return META_SOURCE_LABELS[i][1];
        return id;
    }
    function advSetMode(mode) {
        advMode = mode;
        document.querySelectorAll('#adv-mode .filter-chip').forEach(function(b) {
            var on = b.dataset.mode === mode;
            b.classList.toggle('active', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        // Formats and sources differ per mode, so the picks reset when it changes.
        advChips('adv-formats', ADV_FORMATS[mode], function(f) { return f.toUpperCase(); });
        advChips('adv-sources', ADV_SOURCES[mode], sourceName);
    }
    function advPicked(hostId) {
        return Array.prototype.map.call(document.querySelectorAll('#' + hostId + ' .filter-chip.active'), function(b) { return b.dataset.val; });
    }
    function readAdv() {
        return {
            title:   document.getElementById('adv-title').value.trim(),
            author:  document.getElementById('adv-author').value.trim(),
            year:    document.getElementById('adv-year').value.trim(),
            formats: advPicked('adv-formats'),
            sources: advPicked('adv-sources'),
        };
    }
    advToggle.addEventListener('click', function() {
        advPanel.hidden = !advPanel.hidden;
        advToggle.setAttribute('aria-expanded', advPanel.hidden ? 'false' : 'true');
        if (!advPanel.hidden) { if (!advReady) { advReady = true; advSetMode(advMode); } document.getElementById('adv-title').focus(); }
    });
    document.querySelectorAll('#adv-mode .filter-chip').forEach(function(b) {
        b.addEventListener('click', function() { advSetMode(b.dataset.mode); });
    });
    document.getElementById('adv-clear').addEventListener('click', function() {
        ['adv-title', 'adv-author', 'adv-year'].forEach(function(id) { document.getElementById(id).value = ''; });
        advSetMode(advMode);
    });
    advPanel.addEventListener('submit', function(e) { e.preventDefault(); submitSearch(); });
    var advReady = false; // chips are built on first open, META_SOURCE_LABELS is defined further down the page

    // Runs a search from the bar or the Search button. With the advanced panel open, its mode and fields
    // are used; otherwise it is a plain eBooks search.
    function submitSearch() {
        if (!advPanel.hidden) {
            // Panel open: build the query from title and author, falling back to the search bar's text.
            var a = readAdv();
            var q = ((a.title || searchInput.value.trim()) + ' ' + a.author).trim();
            if (!q) return;
            searchInput.value = q;
            adv = a;
            setMode(advMode);
            doSearch();
            return;
        }
        if (!searchInput.value.trim()) return;
        adv = null;
        setMode('ebooks');
        doSearch();
    }
    document.getElementById('search-btn').addEventListener('click', submitSearch);
    searchInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') submitSearch(); });

    // ── Sticky search bar ─────────────────────────────────────────────────────
    // The search bar is position:sticky in CSS, so the browser keeps it at the top while scrolling. JS only
    // adds a .pinned class once it has stuck (compact size, background) and lets the small logo grow in.
    (function() {
        var bar = document.getElementById('search-bar-wrap');
        if (!bar) return;
        var ticking = false;
        function onScroll() {
            ticking = false;
            bar.classList.toggle('pinned', bar.getBoundingClientRect().top <= 0);
        }
        window.addEventListener('scroll', function() {
            if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
        }, { passive: true });
    })();

    // On mobile, tapping a magnet link often does nothing (no torrent app, and no "copy link" option).
    // So a tap copies the magnet link instead. Desktop keeps the normal link behaviour. This is handled on
    // the results container because the rows are rebuilt on every search.
    // Copies text and tells the user, with a fallback message when the browser blocks clipboard access.
    function copyText(text, doneMsg) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(function() { showToast(doneMsg); })
                .catch(function() { showToast('Could not copy, long-press the link instead'); });
        } else {
            showToast('Could not copy, long-press the link instead');
        }
    }

    // Downloads the .torrent for a result through the server, which gets it from public torrent caches.
    function downloadTorrent(id) {
        showToast('Fetching the torrent file...');
        fetch(API_URL + '/torrent?id=' + encodeURIComponent(id))
            .then(function(r) {
                if (!r.ok) throw new Error('missing');
                var name = ((r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/) || [])[1] || 'download.torrent';
                return r.blob().then(function(b) { return { blob: b, name: name }; });
            })
            .then(function(f) {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(f.blob);
                a.download = f.name;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function() { URL.revokeObjectURL(a.href); }, 5000);
            })
            .catch(function() { showToast('No torrent file found, copy the magnet link instead'); });
    }

    resultsEl.addEventListener('click', function(e) {
        // Card options (Page, Torrent file) never follow the card's main link.
        var action = e.target.closest('.card-action');
        if (action) {
            e.preventDefault();
            e.stopPropagation();
            if (action.dataset.act === 'page') window.open(action.dataset.url, '_blank', 'noopener,noreferrer');
            else if (action.dataset.act === 'torrent') downloadTorrent(action.dataset.id);
            return;
        }

        var item = e.target.closest('.worker-item');
        if (!item) return;

        // Clicking the Magnet tag copies the magnet link instead of opening it.
        if (e.target.closest('.magnet-badge')) {
            e.preventDefault();
            copyText(item.getAttribute('href'), 'Magnet link copied to clipboard');
            return;
        }

        var isMagnetMobile = item.classList.contains('worker-item-magnet')
            && window.matchMedia('(max-width: 1000px)').matches;

        if (isMagnetMobile) {
            e.preventDefault();
            copyText(item.getAttribute('href'), 'Magnet link copied to clipboard');
            return;
        }

        // A magnet link is not a file download from this site (the torrent downloads elsewhere), so only
        // count size and format for links that point at a file.
        if (!item.classList.contains('worker-item-magnet')) {
            recordDownload(item.dataset.format || '', parseInt(item.dataset.size || '0', 10));
        }
    });

    // On page load, check URL params so bookmarked/shared searches work immediately
    (function() {
        var p = new URLSearchParams(window.location.search);
        var q = p.get('q'), m = p.get('mode');
        if (m) setMode(m);
        if (q) { searchInput.value = q; doSearch(); }
    })();

    function doSearch() {
        var q = searchInput.value.trim();
        if (!q) return;
        var sources = currentMode === 'audiobooks' ? AUDIOBOOK_SOURCES : EBOOK_SOURCES;
        recordSearch(currentMode);

        // Update the URL bar so the search is bookmarkable and shareable
        history.pushState({}, '', '?q=' + enc(q) + '&mode=' + currentMode);
        if (tagline) tagline.style.display = 'none';

        // Show the source link cards right away. They do not depend on the server.
        renderSourceLinks(q, sources);

        // Start the direct results search. LibriVox and Manybooks results come straight from the browser
        // (fetchApiResults) and show under the source cards.
        if (API_URL) fetchDirectResults(q);
        fetchApiResults(q, sources);
    }

    // Display names for the server's source keys, used by the loading list and the "N from X" header.
    var META_SOURCE_LABELS = [
        ['libgen', 'LibGen'], ['annas', "Anna's Archive"], ['archive', 'Internet Archive'],
        ['gutenberg', 'Project Gutenberg'], ['openstax', 'OpenStax'], ['libretexts', 'LibreTexts'],
        ['memoryoftheworld', 'Memory of the World'], ['royallib', 'RoyalLib'], ['audiobookbay', 'AudiobookBay'],
        ['librivox', 'LibriVox'], ['audiobooksbee', 'AudiobooksBee'], ['zlibrary', 'Z-Library'], ['mobilism', 'Mobilism'],
    ];

    // ── Direct results search ─────────────────────────────────────────────────
    // Sends the query to the RaveBSD server, which searches every source (browsers cannot, because of CORS)
    // and returns one ranked, deduplicated list with direct links where it could find them.
    //
    // directSearchSeq counts searches. Each callback compares its own number with the latest one before
    // touching the page, so an older search that finishes late (for example after pressing Enter twice)
    // is ignored instead of overwriting the newer one.
    // Advanced search choices as request parameters (empty for a plain search).
    function advParams() {
        if (!adv) return '';
        var out = '';
        if (adv.year)            out += '&year=' + enc(adv.year);
        if (adv.formats.length)  out += '&formats=' + enc(adv.formats.join(','));
        if (adv.sources.length)  out += '&sources=' + enc(adv.sources.join(','));
        return out;
    }

    function fetchDirectResults(q) {
        var el = document.getElementById('worker-results');
        if (!el) return;

        var mySeq = ++directSearchSeq;
        if (currentDirectAbort) currentDirectAbort.abort();
        var abort = new AbortController();
        currentDirectAbort = abort;

        // The server sends one line per source as it finishes. The page lists the sources being searched
        // and ticks each one off as its results arrive.
        el.innerHTML =
            '<div class="worker-loading" id="worker-loading">' +
            '<span class="progress-label">Searching Shadow Libraries and Public Domain Libraries…</span>' +
            '<div class="src-list" id="src-list"></div>' +
            '</div>' +
            '<div id="verify-slot"></div>' +
            '<div id="worker-body"></div>';
        var body = el.querySelector('#worker-body');
        var shownPartial = false, noticeShown = false;

        // Anna's Archive asks for a human check: offer it right here instead of burying it in settings.
        function maybeOfferVerify() {
            if (noticeShown) return;
            noticeShown = true;
            fetch(API_URL + '/settings').then(function(r) { return r.json(); }).then(function(st) {
                var a = st.sources && st.sources.annas;
                var slot = document.getElementById('verify-slot');
                if (!a || !a.needsVerify || !slot || mySeq !== directSearchSeq) return;
                slot.innerHTML = '<div class="verify-notice"><span>Anna\'s Archive wants a quick human check before it can be searched.</span>' +
                    '<button type="button" class="access-btn primary" id="verify-now">Verify now</button></div>';
                document.getElementById('verify-now').addEventListener('click', function() {
                    openVerifyModal(function(solved) { if (solved) doSearch(); });
                });
            }).catch(function() {});
        }

        function labelFor(name) {
            for (var i = 0; i < META_SOURCE_LABELS.length; i++) {
                if (META_SOURCE_LABELS[i][0] === name) return META_SOURCE_LABELS[i][1];
            }
            return name;
        }

        function onProgress(ev) {
            if (mySeq !== directSearchSeq) return;
            var list = document.getElementById('src-list');
            if (!list) return;
            if (ev.sources) {
                list.innerHTML = ev.sources.map(function(n) {
                    return '<div class="src-row" data-src="' + esc(n) + '"><span class="src-name">' + esc(labelFor(n)) + '</span><span class="src-note"></span></div>';
                }).join('');
            } else if (ev.done) {
                if (ev.results && ev.results.length) {
                    // Show what we have now, later sources fill in as they finish.
                    shownPartial = true;
                    renderDirectResults(ev.results, body, {}, q, { partial: true });
                }
                if (ev.done === 'annas' && ev.status === 'unavailable') maybeOfferVerify();
                var row = list.querySelector('[data-src="' + ev.done + '"]');
                if (!row) return;
                row.className = 'src-row done';
                row.lastChild.textContent = ev.status === 'timeout' ? 'timed out'
                    : (ev.status === 'error' || ev.status === 'unavailable') ? 'unavailable'
                    : ev.count + (ev.count === 1 ? ' result' : ' results');
            } else if (ev.phase === 'resolving' && !list.querySelector('[data-src="_resolve"]')) {
                list.insertAdjacentHTML('beforeend', '<div class="src-row" data-src="_resolve"><span class="src-name">Resolving download links</span><span class="src-note"></span></div>');
            }
        }

        // Reads the stream line by line: progress lines go to onProgress, the last line is the result.
        function readStream(res) {
            var reader = res.body.getReader();
            var decoder = new TextDecoder();
            var buf = '';
            var final = null;
            function handle(line) {
                if (!line) return;
                var ev = JSON.parse(line);
                if (ev.final) final = ev.final;
                else if (ev.error) throw new Error(ev.error);
                else onProgress(ev);
            }
            function pump() {
                return reader.read().then(function(chunk) {
                    if (chunk.done) {
                        handle(buf.trim());
                        if (!final) throw new Error('stream ended without results');
                        return final;
                    }
                    buf += decoder.decode(chunk.value, { stream: true });
                    var lines = buf.split('\n');
                    buf = lines.pop();
                    lines.forEach(handle);
                    return pump();
                });
            }
            return pump();
        }

        var timeoutId = setTimeout(function() { abort.abort(); }, DIRECT_TIMEOUT_MS);

        fetch(API_URL + '/search/all?q=' + enc(q) + '&mode=' + currentMode + advParams() + '&stream=1', { signal: abort.signal })
            .then(function(r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                // Cache hits (and any non-streaming reply) come back as plain JSON.
                var streamed = (r.headers.get('Content-Type') || '').indexOf('ndjson') !== -1 && r.body;
                return streamed ? readStream(r) : r.json();
            })
            .then(function(data) {
                clearTimeout(timeoutId);
                if (mySeq !== directSearchSeq) return;
                var meta = data.meta || {};
                var results = data.results || [];
                var loading = document.getElementById('worker-loading');
                if (loading) loading.parentNode.removeChild(loading);
                renderDirectResults(results, body, meta, q);
            })
            .catch(function() {
                clearTimeout(timeoutId);
                if (mySeq !== directSearchSeq) return;
                if (shownPartial) return; // keep whatever already arrived
                setTimeout(function() {
                    if (mySeq !== directSearchSeq) return;
                    // Different from "no direct results found": this means the search itself failed, so we
                    // could not tell. The source cards below still work.
                    el.innerHTML = '<p class="worker-empty">:( Direct results load failed '
                        + 'unexpectedly, please refresh the page and search again</p>';
                }, 300);
            });
    }

    // ── Results renderer ──────────────────────────────────────────────────────
    // Draws the results list: format and source filter chips, paged result rows (RESULTS_PER_PAGE each),
    // and per row a cover, title, details and a download badge.
    var RESULTS_PER_PAGE = 15;
    var LOW_RESULT_THRESHOLD = 5;

    // Removes ISBN-like number strings LibGen sometimes leaves in titles, e.g. "Dune; 9780441013593 b l 123456".
    function cleanTitle(t) {
        return (t || '')
            .replace(/;[^;]{0,4}\d{10,13}[^;]*/g, '')  // "; 9781234567890 b l 123"
            .replace(/\d{13}/g, '')                  // bare 13-digit ISBN
            .replace(/\d{10}/g, '')                  // bare 10-digit ISBN
            .replace(/\s{2,}/g, ' ').trim();
    }

    // Shortens long narrator lists (some AudiobookBay posts list a dozen names) to a few names plus a count.
    function truncateNames(s, max) {
        max = max || 3;
        var parts = (s || '').split(',').map(function(p) { return p.trim(); }).filter(Boolean);
        if (parts.length <= max) return parts.join(', ');
        return parts.slice(0, max).join(', ') + ' & ' + (parts.length - max) + ' more';
    }

    // Maps a result's source name to the short label used on badges and filter chips, in one place so they
    // all agree. A source without a case here shows its own name.
    function sourceLabel(r) {
        switch (r.source) {
            case 'Library Genesis':    return 'LibGen';
            case "Anna's Archive":     return "Anna's";
            case 'AudiobookBay':       return 'AudiobookBay';
            case 'Project Gutenberg':  return 'Gutenberg';
            case 'OpenStax':           return 'OpenStax';
            case 'LibreTexts':         return 'LibreTexts';
            case 'Memory of the World': return 'Memory of the World';
            case 'RoyalLib':            return 'RoyalLib';
            case 'LibriVox':           return 'LibriVox';
            case 'AudiobooksBee':      return 'AudiobooksBee';
            case 'Internet Archive':   return 'Archive.org';
            case 'Z-Library':          return 'Z-Library';
            case 'Mobilism':           return 'Mobilism';
            default:                   return r.source || 'Other';
        }
    }

    // Builds one group of filter chips (Format, Source, Genre or Length) with an "All" chip first.
    function renderFilterGroup(label, filterKey, values, labelFn) {
        labelFn = labelFn || esc;
        var html = '<div class="filter-group"><span class="filter-label">' + label + '</span>';
        html += '<button class="filter-chip active" aria-pressed="true" data-filter="' + filterKey + '" data-val="">All</button>';
        values.forEach(function(v) {
            html += '<button class="filter-chip" aria-pressed="false" data-filter="' + filterKey + '" data-val="' + esc(v) + '">' + labelFn(v) + '</button>';
        });
        html += '</div>';
        return html;
    }

    function renderDirectResults(results, el, meta, q, opts) {
        var partial = !!(opts && opts.partial);
        if (!results.length) {
            if (partial) return;
            el.innerHTML = '<p class="worker-empty">No direct results found, try the source links below.</p>';
            return;
        }

        // Build the source breakdown string shown in the header, e.g.
        // "25 from LibGen, 8 from Anna's Archive, 3 from Internet Archive"
        var sourceParts = [];
        META_SOURCE_LABELS.forEach(function (pair) {
            if (meta[pair[0]] > 0) sourceParts.push(meta[pair[0]] + ' from ' + pair[1]);
        });
        var sourceStr = sourceParts.length
            ? sourceParts.join(', ')
            : (currentMode === 'audiobooks' ? 'LibGen · Internet Archive · AudiobookBay' : "LibGen · Anna's Archive · Internet Archive · Project Gutenberg");

        // Collect the formats, sources, genres and length types found in the results, for the filter chips.
        // Genre and length only come from AudiobookBay, so those groups are hidden when there is nothing to filter.
        var allFormats = [], allSources = [], allCategories = [], allAbridged = [];
        results.forEach(function(r) {
            var fmt = (r.format || '').toLowerCase();
            if (fmt && !allFormats.includes(fmt)) allFormats.push(fmt);
            var src = sourceLabel(r);
            if (!allSources.includes(src)) allSources.push(src);
            (r.categories || []).forEach(function(c) {
                if (!allCategories.includes(c)) allCategories.push(c);
            });
            if (r.abridged && !allAbridged.includes(r.abridged)) allAbridged.push(r.abridged);
        });
        allFormats.sort();
        allCategories.sort();

        // Build the fixed parts: header, filter chips and an empty list container. drawPage() fills the
        // container and runs again whenever a filter or page changes.
        var html = '<div class="worker-header">';
        html += '<span class="tier-label">Direct results <span class="tier-count" id="worker-count">' + results.length + '</span></span>';
        // Source counts and the link-fetching progress share one right-aligned block.
        html += '<span class="worker-header-right"><span class="worker-sources">' + esc(sourceStr) + '</span>';
        html += '<span class="worker-sources" id="resolve-status"></span></span>';
        html += '</div>';
        // Few results: point to the source link cards below, which may find more. The threshold is low on
        // purpose, since a very specific search (like an ISBN) can legitimately return only 1 or 2.
        if (!partial && results.length < LOW_RESULT_THRESHOLD) {
            html += '<p class="worker-low-results">Only a few direct results, the source links below may turn up more.</p>';
        }

        // Only show filter chips if there's something to filter by
        if (allFormats.length > 1 || allSources.length > 1 || allCategories.length > 1 || allAbridged.length > 1) {
            html += '<div class="worker-filters">';
            // The Format chip text is uppercase (EPUB), the other groups show the value as is.
            if (allFormats.length > 1) html += renderFilterGroup('Format', 'fmt', allFormats, function(f) { return f.toUpperCase(); });
            if (allSources.length > 1) html += renderFilterGroup('Source', 'src', allSources);
            // Genre, from AudiobookBay's category tags
            if (allCategories.length > 1) html += renderFilterGroup('Genre', 'cat', allCategories);
            // Abridged or unabridged, from AudiobookBay's detail pages
            if (allAbridged.length > 1) html += renderFilterGroup('Length', 'abr', allAbridged);
            html += '</div>';
        }

        html += '<div id="worker-page-content"></div>';
        el.innerHTML = html;

        // Filter state, shared between filter chips and pagination so they work together
        var activeFmt = '', activeSrc = '', activeCat = '', activeAbr = '', currentPage = 0;

        // Returns results filtered by every currently active filter chip
        function getFiltered() {
            return results.filter(function(r) {
                var fmt = (r.format || '').toLowerCase();
                var src = sourceLabel(r);
                if (adv && adv.formats.length && fmt && adv.formats.indexOf(fmt) < 0) return false; // format found after resolving
                return (!activeFmt || fmt === activeFmt)
                    && (!activeSrc || src === activeSrc)
                    && (!activeCat || (r.categories || []).includes(activeCat))
                    && (!activeAbr || r.abridged === activeAbr);
            });
        }

        // Draws the current page of results. Runs on first load, on filter changes and on page changes.
        function drawPage() {
            var filtered  = getFiltered();
            var total     = filtered.length;
            var pageCount = Math.ceil(total / RESULTS_PER_PAGE) || 1;
            if (currentPage >= pageCount) currentPage = pageCount - 1;
            var pageItems = filtered.slice(currentPage * RESULTS_PER_PAGE, (currentPage + 1) * RESULTS_PER_PAGE);

            // Update the result count in the header to reflect the filtered total
            var countEl = el.querySelector('#worker-count');
            if (countEl) countEl.textContent = total;

            var h = '<div class="worker-list">';
            pageItems.forEach(function(r, idx) {
                var fmt   = (r.format || '').toLowerCase().replace(/^\./, '');
                var title = cleanTitle(r.title);

                // Details line: author, narrator, year, bitrate, abridged, pages, ISBN. Narrator, bitrate and
                // abridged only come from AudiobookBay, ISBN only from LibGen. Format and file size go on their
                // own line below.
                var rm = [];
                if (r.author)                     rm.push(esc(r.author));
                if (r.narrator)                   rm.push('Read by ' + esc(truncateNames(r.narrator)));
                if (r.year)                       rm.push(esc(r.year));
                if (r.bitrate)                    rm.push(esc(r.bitrate));
                if (r.abridged)                   rm.push(esc(r.abridged));
                if (r.pages)                      rm.push(esc(r.pages) + ' pp');
                if (r.isbn)                       rm.push('ISBN ' + esc(r.isbn));

                var fm = [];
                if (fmt)                          fm.push('<span class="fmt-badge fmt-' + fmt + '">' + fmt.toUpperCase() + '</span>');
                if (r.filesize && r.filesize > 0) fm.push(formatSize(r.filesize));

                var sl = sourceLabel(r);

                // What the link on a row does, by source:
                //   LibGen: directUrl is the real file (get.php); downloadUrl is the ads.php page.
                //   RoyalLib: directUrl is a format confirmed on the book page; otherwise downloadUrl is the book page.
                //   Anna's Archive: downloadUrl is the /md5/ page, whose download has a wait timer (Timer badge).
                //     If the same file is on LibGen, a direct LibGen link is found in the background.
                //   AudiobookBay: a magnet link, handled by the user's own torrent client.
                //   Project Gutenberg and Z-Library: directUrl is already the file link.
                //   AudiobooksBee: downloadUrl is a Rapidgator page with its own wait timer (Timer badge).
                var href     = r.directUrl || r.magnet || r.downloadUrl;
                var isDirect = !!r.directUrl;
                var isMagnet = !!r.magnet;
                var isTimer  = !isDirect && (r.source === "Anna's Archive" || r.source === 'AudiobooksBee');

                // Audiobook cover art is conventionally square, unlike ebook covers
                var isAudioMode      = currentMode === 'audiobooks';
                var coverImgClass    = isAudioMode ? 'worker-cover-square' : 'worker-cover';
                var coverEmptyClass  = isAudioMode ? 'worker-cover-square worker-cover-empty-square' : 'worker-cover worker-cover-empty';
                var coverHtml = r.coverUrl
                    ? '<img class="' + coverImgClass + '" src="' + esc(r.coverUrl) + '" alt="" loading="lazy" onerror="this.style.display=&#39;none&#39;">'
                    : '<div class="' + coverEmptyClass + '"></div>';

                var mainHtml = '<div class="worker-item-main">'
                    + '<span class="worker-title">' + esc(title) + '</span>'
                    + (rm.length ? '<span class="worker-meta">' + rm.join(' · ') + '</span>' : '')
                    + (fm.length ? '<span class="worker-meta worker-meta-format">' + fm.join(' · ') + '</span>' : '')
                    + '</div>';

                h += '<a class="worker-item' + (isDirect ? ' worker-item-direct' : '') + (isTimer ? ' worker-item-timer' : '') + (isMagnet ? ' worker-item-magnet' : '') + '"'
                   + ' href="' + esc(href) + '" target="_blank" rel="noopener noreferrer"'
                   + ' data-format="' + esc(fmt) + '" data-size="' + (parseInt(r.filesize || 0) || 0) + '"'
                   + ' data-source="' + esc(r.source) + '">';
                h += coverHtml;
                h += mainHtml;
                h += '<div class="worker-item-right">';
                if (isDirect)      h += '<span class="direct-badge">↓ Direct</span>';
                else if (isMagnet) h += '<span class="magnet-badge" title="Click to copy the magnet link">🧲 Magnet</span>';
                else if (isTimer)  h += '<span class="timer-badge">⏱ Timer</span>';
                h += '<span class="worker-source-badge">' + sl + '</span>';

                // Extra options: open the source's own page instead of the main link, or get a .torrent
                // file instead of using the magnet link. The main link of the card is unchanged.
                var pageUrl = r.pageUrl || (r.downloadUrl && r.downloadUrl !== r.directUrl ? r.downloadUrl : '');
                var actions = '';
                if (pageUrl && pageUrl !== href && /^https?:/i.test(pageUrl)) {
                    actions += '<button type="button" class="card-action" data-act="page" data-url="' + esc(pageUrl) + '" title="Open the source page instead">Visit Page</button>';
                }
                if (isMagnet && r.infoHash && r.id) {
                    actions += '<button type="button" class="card-action" data-act="torrent" data-id="' + esc(r.id) + '" title="Download a .torrent file instead of using the magnet link">Torrent file</button>';
                }
                if (actions) h += '<div class="card-actions">' + actions + '</div>';
                h += '</div></a>';
            });
            h += '</div>';

            // Pagination controls, only shown when there's more than one page
            if (pageCount > 1) {
                h += '<div class="worker-pagination">';
                h += '<button class="page-btn" id="wb-prev" aria-label="Previous page"' + (currentPage === 0 ? ' disabled' : '') + '>←</button>';
                h += '<span class="page-info">' + (currentPage + 1) + ' / ' + pageCount + '</span>';
                h += '<button class="page-btn" id="wb-next" aria-label="Next page"' + (currentPage >= pageCount - 1 ? ' disabled' : '') + '>→</button>';
                h += '</div>';
            }

            // Inject into the page container and wire up pagination buttons
            var wrap = el.querySelector('#worker-page-content');
            wrap.innerHTML = h;

            var prev = wrap.querySelector('#wb-prev');
            var next = wrap.querySelector('#wb-next');
            if (prev) prev.addEventListener('click', function() {
                currentPage = Math.max(0, currentPage - 1);
                drawPage();
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            if (next) next.addEventListener('click', function() {
                currentPage = Math.min(pageCount - 1, currentPage + 1);
                drawPage();
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        }

        // Wire up filter chips, each click resets to page 0 and redraws
        el.querySelectorAll('.filter-chip').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var group = btn.dataset.filter;
                var val   = btn.dataset.val;
                el.querySelectorAll('.filter-chip[data-filter="' + group + '"]').forEach(function(b) { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
                btn.classList.add('active');
                btn.setAttribute('aria-pressed', 'true');
                if (group === 'fmt') activeFmt = val;
                if (group === 'src') activeSrc = val;
                if (group === 'cat') activeCat = val;
                if (group === 'abr') activeAbr = val;
                currentPage = 0;
                drawPage();
            });
        });

        drawPage();

        // ── Background direct-link fetching ───────────────────────────────────
        // Results without a direct link get one looked up through /resolve, four at a time. Direct results
        // move to the top as they arrive, then magnets, then the rest.
        var RESOLVABLE = { 'Library Genesis': 1, "Anna's Archive": 1, 'RoyalLib': 1, 'Internet Archive': 1, 'AudiobookBay': 1, 'AudiobooksBee': 1 };
        function linkTier(r) { return currentMode === 'audiobooks' && r.source === 'AudiobookBay' ? 3 : r.directUrl ? 2 : r.magnet ? 1 : 0; }
        // Same order as the server (mergeAndRank): AudiobookBay first in audiobook mode, then direct links,
        // then magnets, then the rest. Within a group, sources take turns so one source cannot fill the page.
        function rankResults(list) {
            var sorted = list.slice().sort(function(a, b) { return linkTier(b) - linkTier(a) || (b._score || 0) - (a._score || 0); });
            var out = [];
            [3, 2, 1, 0].forEach(function(t) {
                var queues = {}, order = [];
                sorted.forEach(function(r) {
                    if (linkTier(r) !== t) return;
                    if (!queues[r.source]) { queues[r.source] = []; order.push(r.source); }
                    queues[r.source].push(r);
                });
                for (var i = 0; order.some(function(n) { return i < queues[n].length; }); i++) {
                    order.forEach(function(n) { if (i < queues[n].length) out.push(queues[n][i]); });
                }
            });
            list.length = 0;
            out.forEach(function(r) { list.push(r); });
        }
        function startResolver() {
            var queue = results.filter(function(r) { return r.id && !r.directUrl && !r.magnet && RESOLVABLE[r.source]; });
            var total = queue.length, done = 0, active = 0, timer = null, seq = directSearchSeq;
            if (!total) return;
            var statusEl = el.querySelector('#resolve-status');
            function show() { if (statusEl) statusEl.textContent = done < total ? 'Fetching direct links ' + done + '/' + total + '...' : ''; }
            function refresh() {
                if (timer) return;
                timer = setTimeout(function() {
                    timer = null;
                    if (seq !== directSearchSeq) return;
                    rankResults(results);
                    drawPage();
                }, 1200);
            }
            function next() {
                if (seq !== directSearchSeq) return;
                while (active < 4 && queue.length) {
                    (function(r) {
                        active++;
                        fetch(API_URL + '/resolve?id=' + encodeURIComponent(r.id))
                            .then(function(res) { return res.json(); })
                            .then(function(d) {
                                if (d.directUrl) r.directUrl = d.directUrl;
                                if (d.magnet) r.magnet = d.magnet;
                                if (d.infoHash) r.infoHash = d.infoHash;
                                if (d.downloadUrl) r.downloadUrl = d.downloadUrl;
                                if (d.format) r.format = d.format;
                                if (d.filesize) r.filesize = d.filesize;
                                if (d.directUrl || d.magnet) refresh();
                            })
                            .catch(function() {})
                            .then(function() { active--; done++; show(); next(); });
                    })(queue.shift());
                }
            }
            show();
            next();
        }

        if (!partial) startResolver();
    }

    function formatSize(bytes) {
        bytes = parseInt(bytes);
        if (bytes > 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
        if (bytes > 1024)    return Math.round(bytes / 1024) + ' KB';
        return bytes + ' B';
    }

    // ── Source link grid ──────────────────────────────────────────────────────
    // Draws the three tiers of source cards (buttons that open a search on each site). Tier 3 is collapsed.
    // It also adds the empty #worker-results box for the direct results, and the Mode chips above everything.
    function renderSourceLinks(q, sources) {
        var t1 = sources.filter(function(s){return s.tier===1;});
        var t2 = sources.filter(function(s){return s.tier===2;});
        var t3 = sources.filter(function(s){return s.tier===3;});

        var directSlot = API_URL ? '<div id="worker-results" class="worker-results"></div>' : '';

        // Mode chips. Unlike the format and source chips (which filter results already on the page),
        // switching mode runs a new search: the modes use different sources and cards. One mode is always
        // active. Drawn here, not in renderDirectResults, so they show even before results arrive.
        var modeFilterHtml = '<div class="worker-filters mode-filter-bar">'
            + '<div class="filter-group"><span class="filter-label">Mode</span>'
            + '<button class="filter-chip mode-filter-chip' + (currentMode === 'ebooks' ? ' active' : '') + '" aria-pressed="' + (currentMode === 'ebooks' ? 'true' : 'false') + '" data-mode="ebooks">eBooks</button>'
            + '<button class="filter-chip mode-filter-chip' + (currentMode === 'audiobooks' ? ' active' : '') + '" aria-pressed="' + (currentMode === 'audiobooks' ? 'true' : 'false') + '" data-mode="audiobooks">Audiobooks</button>'
            + '</div></div>';

        var html = modeFilterHtml
                 + directSlot
                 + tierBlock('Best sources',       t1, q, false)
                 + tierBlock('More sources',       t2, q, false)
                 + tierBlock('Additional sources', t3, q, true)
                 + '<div id="api-results" class="api-section"></div>'
                 + '<div class="results-bottom-pad"></div>';
        resultsEl.innerHTML = html;

        resultsEl.querySelectorAll('.mode-filter-chip').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var mode = btn.dataset.mode;
                if (mode === currentMode) return;
                setMode(mode);
                if (adv) { adv.sources = []; adv.formats = []; }
                doSearch();
            });
        });

        // Wire up the tier 3 toggle arrow
        var tog  = document.getElementById('t3-toggle');
        var grid = document.getElementById('t3-grid');
        if (tog && grid) {
            tog.addEventListener('click', function() {
                var open = grid.classList.toggle('open');
                tog.querySelector('.t3-arrow').innerHTML = open ? '&#9650;' : '&#9660;';
            });
        }
    }

    // Builds one tier block of source cards as an HTML string
    function tierBlock(label, sources, q, collapsible) {
        if (!sources.length) return '';
        var html = '<div class="tier-block">';
        html += '<div class="tier-header"' + (collapsible ? ' id="t3-toggle"' : '') + '>';
        html += '<span class="tier-label">' + label + ' <span class="tier-count">' + sources.length + '</span></span>';
        if (collapsible) html += '<span class="t3-arrow">&#9660;</span>';
        html += '</div>';
        html += '<div class="source-grid' + (collapsible ? ' collapsible" id="t3-grid"' : '"') + '>';
        sources.forEach(function(s) {
            html += '<a class="source-card tier' + s.tier + '" href="' + esc(s.searchUrl(q)) + '" target="_blank" rel="noopener noreferrer"'
                  + (s.note ? ' title="' + esc(s.note) + '"' : '') + '>'
                  + '<span class="card-label">' + esc(s.label) + '</span>'
                  + '<span class="card-arrow">&#8599;</span>'
                  + '</a>';
        });
        html += '</div></div>';
        return html;
    }

    // ── Live results from LibriVox and Manybooks ──────────────────────────────
    // These two have public APIs the browser can call directly. Their results go in #api-results under the
    // source cards, separate from the ranked list because they only cover free and public domain books.
    function fetchApiResults(q, sources) {
        var apis = sources.filter(function(s){return s.api && s.parseApi;});
        if (!apis.length) return;
        var el = document.getElementById('api-results');
        if (!el) return;
        el.innerHTML = '<p class="api-fetching">Fetching live results…</p>';
        var all = [], pending = apis.length;
        apis.forEach(function(s) {
            fetch(s.api(q))
                .then(function(r){return r.json();})
                .then(function(json){ s.parseApi(json).forEach(function(item){item.source=s.label;all.push(item);}); })
                .catch(function(){})
                .finally(function(){ if(--pending===0) renderApiResults(all, el); });
        });
    }

    // Renders the LibriVox/Manybooks results as a simple list below the source cards
    function renderApiResults(results, el) {
        if (!results.length) { el.innerHTML = ''; return; }
        var html = '<p class="tier-label">Live results <span class="tier-count">' + results.length + '</span></p><div class="live-list">';
        results.forEach(function(r) {
            html += '<a class="live-item" href="' + esc(r.url) + '" target="_blank" rel="noopener noreferrer">'
                  + '<span class="live-title">' + esc(r.title) + '</span>'
                  + '<span class="live-source">' + esc(r.source) + '</span></a>';
        });
        html += '</div>';
        el.innerHTML = html;
    }

    // Utility: URL-encode a string for use in query parameters
    function enc(s) { return encodeURIComponent(s); }
    // esc() comes from js/common.js
    </script>
</body>
</html>
