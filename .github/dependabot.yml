# Opens a weekly pull request when a pinned GitHub Action, the Docker base image or an npm package has a
# newer version. Each ecosystem's updates come grouped in a single pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # Minor and patch updates come grouped; a new major version gets its own pull request, since it can
    # change an action's inputs.
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      base-image:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      npm:
        patterns: ['*']
